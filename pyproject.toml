[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femwavemesh"
version = "0.2.0"
description = "Unstructured meshes and mesh-size laws for finite-element wave solvers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU Lesser General Public License v3 or later (LGPLv3+)" }
dependencies = [
  "numpy",
  "scipy",
  "gmsh",
  "firedrake-fiat",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["pytest", "flake8", "ruff"]

[tool.setuptools.packages.find]
# kmvmesh: the former name, an alias of femwavemesh kept for existing code.
include = ["femwavemesh*", "kmvmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["tests/regression/legacy"]

[tool.ruff.lint]
select = ["E", "F", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
